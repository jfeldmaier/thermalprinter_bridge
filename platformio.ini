; =============================================================================
; PlatformIO Projekt-Konfiguration
; ESP32-S3 USB-Host Thermodrucker Bridge
; =============================================================================

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Flash & PSRAM Konfiguration ---
; esptool erkennt:  8 MB QD Flash  +  2 MB Embedded PSRAM (AP_3v3)
; → Standard-Board-Definition (8 MB) passt, kein Override nötig.
; Memory-Type:  qio_qspi  =  QIO-Flash + QSPI-PSRAM  (passend für
;   den eingebetteten 2 MB PSRAM des ESP32-S3-QFN56)
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv

; --- Dateisystem (LittleFS) ---
; Die Dateien im /data Ordner werden mit "pio run -t uploadfs" hochgeladen
board_build.filesystem = littlefs

; --- Build Flags ---
build_flags =
    -DBOARD_HAS_PSRAM                  ; PSRAM aktivieren
    -DARDUINO_USB_CDC_ON_BOOT=0        ; USB-CDC NICHT für Serial nutzen
    -DARDUINO_USB_MODE=0               ; USB-OTG (nicht CDC/JTAG) → nötig für USB-Host
                                        ;   → Der USB-OTG-Port bleibt frei für Host-Modus
                                        ;   → Serial Monitor läuft über den UART-Bridge-Chip (USB-UART Buchse)

; --- Serial Monitor ---
monitor_speed = 115200

; --- Bibliotheken ---
lib_deps =
    https://github.com/mathieucarbou/ESPAsyncWebServer.git
    https://github.com/mathieucarbou/AsyncTCP.git
